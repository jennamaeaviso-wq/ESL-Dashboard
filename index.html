<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#b8d8c0">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>ESL Tutor Dashboard</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icons/icon-192.png">
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f5faf6}
    #appFrame{display:block;border:0;width:100%;height:100%;height:100dvh;background:#fff}
    #setup{position:fixed;inset:0;display:none;z-index:10;box-sizing:border-box;padding:28px;background:#f5faf6;font-family:Arial,sans-serif}
    #setup .box{max-width:650px;margin:8vh auto;background:#fff;border-radius:18px;padding:28px;box-shadow:0 8px 30px rgba(0,0,0,.08)}
    #setup h1{margin-top:0}
    #setup input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #ccd8cf;border-radius:10px;font-size:16px}
    #setup button{margin-top:12px;padding:12px 18px;border:0;border-radius:10px;background:#b8d8c0;cursor:pointer}
    #setup small{display:block;margin-top:12px;color:#667}
  </style>
</head>
<body>
  <div id="setup">
    <div class="box">
      <h1>ESL Tutor Dashboard</h1>
      <p>Paste your deployed Google Apps Script Web App URL below. This is only needed the first time.</p>
      <input id="url" type="url" placeholder="https://script.google.com/macros/s/.../exec">
      <button id="save">Open My Dashboard</button>
      <small>Your existing Apps Script dashboard remains unchanged.</small>
    </div>
  </div>

  <iframe id="appFrame" title="ESL Tutor Dashboard" allow="clipboard-read; clipboard-write"></iframe>

  <script>
    const DEFAULT_URL = "";
    const KEY = "eslTutorAppsScriptUrl";
    const frame = document.getElementById("appFrame");
    const setup = document.getElementById("setup");
    const input = document.getElementById("url");

    function validUrl(value){
      try {
        const u = new URL(value);
        return u.protocol === "https:" && u.hostname.includes("google.com");
      } catch(e){ return false; }
    }

    function openDashboard(url){
      if (!validUrl(url)) {
        setup.style.display = "block";
        input.value = url || "";
        return;
      }
      localStorage.setItem(KEY, url);
      setup.style.display = "none";
      frame.src = url;
    }

    document.getElementById("save").addEventListener("click", () => {
      const url = input.value.trim();
      if (!validUrl(url)) {
        alert("Please paste your Google Apps Script Web App URL ending in /exec.");
        return;
      }
      openDashboard(url);
    });

    const saved = localStorage.getItem(KEY) || DEFAULT_URL;
    openDashboard(saved);

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./service-worker.js").catch(console.error);
      });
    }
  </script>
</body>
</html>
